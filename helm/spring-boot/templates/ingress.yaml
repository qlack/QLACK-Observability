## Ingress template: Creates a Kubernetes Ingress for each enabled microservice with ingress enabled.
## Loops over all services, checks if enabled and ingress.enabled, and renders an Ingress resource.

{{- range $svcName, $svc := .Values.services }}
{{- if and $svc.enabled $svc.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Ingress name is release name + service name, truncated for K8s
  name: {{ printf "%s-%s" $.Release.Name $svcName | trunc 63 | trimSuffix "-" }}
  labels:
    # Standard and component labels
    {{- include "spring-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
  {{- with $svc.ingress.className }}
  {{- if ne . "" }}
  annotations:
    kubernetes.io/ingress.class: {{ . | quote }} # Optional ingress class annotation
  {{- end }}
  {{- end }}
spec:
  {{- if $svc.ingress.tls }}
  tls:
    {{- toYaml $svc.ingress.tls | nindent 4 }} # TLS configuration for ingress
  {{- end }}
  rules:
    {{- range $host := $svc.ingress.hosts }}
    - host: {{ $host.host | quote }} # Hostname for ingress
      http:
        paths:
          {{- range $p := $host.paths }}
          - path: {{ $p.path | quote }} # Path for ingress
            pathType: {{ $p.pathType }} # Path type (Prefix, Exact)
            backend:
              service:
                name: {{ printf "%s-%s" $.Release.Name $svcName | trunc 63 | trimSuffix "-" }} # Backend service name
                port:
                  number: {{ $svc.service.port }} # Backend service port
          {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
