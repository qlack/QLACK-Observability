## Secret template: Creates a Kubernetes Secret for each enabled microservice that requests envFromSecret.
## Loops over all services, checks if enabled and envFromSecret, and renders a Secret resource.

{{- range $svcName, $svc := .Values.services }}
{{- if and $svc.enabled $svc.envFromSecret }}
apiVersion: v1
kind: Secret
metadata:
  # Secret name is release name + service name, truncated for K8s
  name: {{ printf "%s-%s" $.Release.Name $svcName | trunc 63 | trimSuffix "-" }}
  labels:
    # Standard and component labels
    {{- include "spring-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
type: Opaque # Opaque type for generic secrets
stringData: {} # Add key-value pairs for environment variables as needed
---
{{- end }}
{{- end }}
