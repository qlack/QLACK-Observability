# ConfigMap template: Creates a Kubernetes ConfigMap for each enabled microservice that requests envFromConfigMap.
# Loops over all services, checks if enabled and envFromConfigMap, and renders a ConfigMap resource.
{{- range $svcName, $svc := .Values.services }}
{{- if and $svc.enabled $svc.envFromConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  # ConfigMap name is release name + service name, truncated for K8s
  name: {{ printf "%s-%s" $.Release.Name $svcName | trunc 63 | trimSuffix "-" }}
  labels:
    # Standard and component labels
    {{- include "spring-stack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
data: {} # Add key-value pairs for environment variables as needed
---
{{- end }}
{{- end }}
