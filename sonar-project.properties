# SonarQube configuration for QLACK Observability

# Project identification
sonar.projectKey=com.eurodyn.qlack.observability:qlack-observability
sonar.projectName=QLACK Observability
sonar.projectVersion=1.0.0-SNAPSHOT

# Language settings
sonar.language=java

# Modules (when using a multi-module maven project)
sonar.modules=service-timeauthority,service-todo

# Service-timeauthority module details
service-timeauthority.sonar.projectName=QLACK Observability - TimeAuthority
service-timeauthority.sonar.projectBaseDir=spring-boot/service-timeauthority
# the actual java sources live in the impl submodule
service-timeauthority.sonar.sources=service-timeauthority-impl/src/main/java
service-timeauthority.sonar.java.binaries=service-timeauthority-impl/target/classes

# Service-todo module details
service-todo.sonar.projectName=QLACK Observability - Todo
service-todo.sonar.projectBaseDir=spring-boot/service-todo
service-todo.sonar.sources=src/main/java
service-todo.sonar.java.binaries=target/classes

# Exclusions (if any)
# sonar.exclusions=**/generated/**

# Encoding
sonar.sourceEncoding=UTF-8
