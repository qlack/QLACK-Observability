server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:
          endpoint: 'tempo:4318'

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

metrics_generator:
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  processor:
    # service-graphs generates metrics for service graphs in Grafana
    service_graphs:
    # span-metrics generates RED (Rate, Error, Duration) metrics for spans
    span_metrics:

